<!-- ═════════════ LỊCH SỬ KHUYẾN MÃI ═════════════ -->

<!-- Stats Cards -->
<div class="stats-grid" id="history-stats">
    <div class="stat-card">
        <div class="stat-card__icon stat-card__icon--green"><i class="fa fa-fire"></i></div>
        <div class="stat-card__info">
            <span class="stat-card__label">Đang chạy</span>
            <span class="stat-card__value" id="hist-active">0</span>
        </div>
    </div>
    <div class="stat-card">
        <div class="stat-card__icon stat-card__icon--gold"><i class="fa fa-clock"></i></div>
        <div class="stat-card__info">
            <span class="stat-card__label">Sắp diễn ra</span>
            <span class="stat-card__value" id="hist-upcoming">0</span>
        </div>
    </div>
    <div class="stat-card">
        <div class="stat-card__icon stat-card__icon--red"><i class="fa fa-ban"></i></div>
        <div class="stat-card__info">
            <span class="stat-card__label">Đã kết thúc</span>
            <span class="stat-card__value" id="hist-expired">0</span>
        </div>
    </div>
    <div class="stat-card">
        <div class="stat-card__icon stat-card__icon--blue"><i class="fa fa-list"></i></div>
        <div class="stat-card__info">
            <span class="stat-card__label">Tổng chương trình</span>
            <span class="stat-card__value" id="hist-total">0</span>
        </div>
    </div>
</div>

<!-- Toolbar -->
<div class="admin-table-wrapper" style="margin-bottom: 24px;">
    <div class="admin-table-toolbar">
        <div class="admin-table-toolbar__search">
            <i class="fa fa-search"></i>
            <input type="text" id="hist-search" placeholder="Tìm tên chương trình, xe..." oninput="filterHistory()">
        </div>
        <div class="admin-table-toolbar__actions">
            <select id="hist-filter-status" onchange="filterHistory()" style="padding:8px 12px; background:rgba(255,255,255,0.06); color:#aaa; border:1px solid #333; border-radius:8px; font-size:13px; font-family:inherit;">
                <option value="all">Tất cả</option>
                <option value="active">🟢 Đang chạy</option>
                <option value="upcoming">🟡 Sắp diễn ra</option>
                <option value="expired">⚫ Đã kết thúc</option>
            </select>
            <select id="hist-filter-car" onchange="filterHistory()" style="padding:8px 12px; background:rgba(255,255,255,0.06); color:#aaa; border:1px solid #333; border-radius:8px; font-size:13px; font-family:inherit;">
                <option value="all">Tất cả xe</option>
            </select>
            <button class="btn-admin btn-admin--outline" onclick="exportHistoryCSV()">
                <i class="fa fa-download"></i> Export CSV
            </button>
            <button class="btn-admin btn-admin--primary" onclick="navigateTo('saleManager.html', document.querySelector('[data-page=sales]'))">
                <i class="fa fa-plus"></i> Tạo mới
            </button>
        </div>
    </div>
</div>

<!-- Section: ĐANG CHẠY (Cards) -->
<div id="hist-active-section" style="margin-bottom: 28px;">
    <h3 style="font-family:'Montserrat',sans-serif; font-size:16px; font-weight:700; color:#fff; margin-bottom:16px; display:flex; align-items:center; gap:8px;">
        <i class="fa fa-fire" style="color:#EB0A1E;"></i> ĐANG CHẠY
        <span id="hist-active-count" style="background:#EB0A1E; color:#fff; font-size:11px; padding:2px 8px; border-radius:10px;">0</span>
    </h3>
    <div id="hist-active-cards" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(340px, 1fr)); gap:16px;">
        <!-- Rendered by JS -->
    </div>
</div>

<!-- Section: ĐÃ KẾT THÚC (Table) -->
<div class="admin-table-wrapper">
    <h3 style="font-family:'Montserrat',sans-serif; font-size:16px; font-weight:700; color:#fff; padding:16px 20px; border-bottom:1px solid #333; display:flex; align-items:center; gap:8px;">
        <i class="fa fa-history" style="color:#666;"></i> ĐÃ KẾT THÚC
        <span id="hist-expired-count" style="background:#444; color:#aaa; font-size:11px; padding:2px 8px; border-radius:10px;">0</span>
    </h3>
    <div style="overflow-x: auto;">
        <table class="admin-table">
            <thead>
                <tr>
                    <th>Tên CT</th>
                    <th>Xe áp dụng</th>
                    <th>Loại KM</th>
                    <th>Mức giảm</th>
                    <th>Bắt đầu</th>
                    <th>Kết thúc</th>
                    <th>Suất dùng</th>
                    <th>Hiệu quả</th>
                    <th>Hành động</th>
                </tr>
            </thead>
            <tbody id="hist-expired-tbody"></tbody>
        </table>
    </div>
</div>

<!-- Custom CSS cho history cards -->
<style>
    .hist-card {
        background: var(--admin-card-bg, #222);
        border: 1px solid var(--admin-border, #333);
        border-radius: 12px;
        padding: 20px;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
    }
    .hist-card:hover {
        border-color: #EB0A1E;
        transform: translateY(-2px);
        box-shadow: 0 4px 20px rgba(235,10,30,0.15);
    }
    .hist-card__badge {
        position: absolute;
        top: 12px;
        right: 12px;
        background: #EB0A1E;
        color: #fff;
        font-size: 10px;
        font-weight: 700;
        padding: 3px 10px;
        border-radius: 4px;
        text-transform: uppercase;
    }
    .hist-card__header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
    }
    .hist-card__img {
        width: 60px;
        height: 40px;
        object-fit: contain;
        border-radius: 6px;
        background: rgba(255,255,255,0.04);
    }
    .hist-card__title {
        font-weight: 700;
        color: #fff;
        font-size: 14px;
        line-height: 1.3;
    }
    .hist-card__car {
        font-size: 12px;
        color: #aaa;
    }
    .hist-card__price {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
    }
    .hist-card__original {
        text-decoration: line-through;
        color: #666;
        font-size: 12px;
    }
    .hist-card__sale {
        color: #EB0A1E;
        font-weight: 700;
        font-size: 15px;
    }
    .hist-card__progress {
        margin-bottom: 12px;
    }
    .hist-card__progress-bar {
        height: 6px;
        border-radius: 3px;
        background: rgba(255,255,255,0.08);
        overflow: hidden;
        margin-bottom: 4px;
    }
    .hist-card__progress-fill {
        height: 100%;
        border-radius: 3px;
        background: linear-gradient(90deg, #EB0A1E, #FF3345);
    }
    .hist-card__progress-label {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: #888;
    }
    .hist-card__countdown {
        font-family: 'Courier New', monospace;
        font-size: 13px;
        font-weight: 700;
        color: #22C55E;
        margin-bottom: 12px;
        display: flex;
        align-items: center;
        gap: 6px;
    }
    .hist-card__countdown.urgent {
        color: #EB0A1E;
        animation: badgeBlink 1.5s ease-in-out infinite;
    }
    .hist-card__actions {
        display: flex;
        gap: 8px;
    }
    .hist-card__actions button {
        flex: 1;
        padding: 8px;
        border-radius: 6px;
        border: none;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
    }
    .hist-btn-edit {
        background: rgba(59,130,246,0.15);
        color: #3B82F6;
    }
    .hist-btn-edit:hover { background: rgba(59,130,246,0.3); }
    .hist-btn-pause {
        background: rgba(245,158,11,0.15);
        color: #F59E0B;
    }
    .hist-btn-pause:hover { background: rgba(245,158,11,0.3); }
    .hist-btn-delete {
        background: rgba(235,10,30,0.15);
        color: #EB0A1E;
    }
    .hist-btn-delete:hover { background: rgba(235,10,30,0.3); }

    /* Hiệu quả badges */
    .eff-good { color: #22C55E; font-weight: 700; }
    .eff-avg { color: #F59E0B; font-weight: 700; }
    .eff-low { color: #EB0A1E; font-weight: 700; }
</style>
