<!-- ═══════════════════════════════════════════════════════
     QUẢN LÝ KHÁCH HÀNG — N18-AUTO Admin
     Dark theme đỏ-đen | Be Vietnam Pro | SVG icons only
     ═══════════════════════════════════════════════════════ -->
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
/* ── Page scope ── */
.om { font-family: 'Be Vietnam Pro', sans-serif; }

/* ── Header ── */
.om-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 24px;
}
.om-header__title {
    font-size: 26px; font-weight: 800; color: #eee; margin: 0;
}
.om-header__title span { color: #C8102E; }

/* ── Toolbar ── */
.om-toolbar {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    margin-bottom: 20px;
}
.om-toolbar__input {
    background: #181818; border: 1px solid rgba(255,255,255,0.1);
    color: #ccc; padding: 9px 14px; border-radius: 8px;
    font-size: 13px; font-family: 'Be Vietnam Pro', sans-serif;
    outline: none;
}
.om-toolbar__input:focus { border-color: #C8102E; }
.om-toolbar__input::placeholder { color: #555; }

.om-toolbar__btn-add {
    display: inline-flex; align-items: center; gap: 6px;
    background: #C8102E; color: #fff; border: none;
    padding: 9px 18px; border-radius: 8px;
    font-size: 13px; font-weight: 600;
    font-family: 'Be Vietnam Pro', sans-serif;
    cursor: pointer; transition: all 0.2s; margin-left: auto;
}
.om-toolbar__btn-add:hover { background: #9B0B22; }

/* ── Table ── */
.om-table {
    width: 100%; border-collapse: separate; border-spacing: 0;
    font-size: 13px;
}
.om-table thead th {
    background: #181818; color: #666; font-weight: 600;
    text-transform: uppercase; font-size: 10.5px; letter-spacing: 0.5px;
    padding: 12px 14px; border-bottom: 1px solid #222;
    text-align: left; white-space: nowrap;
}
.om-table tbody tr {
    border-bottom: 1px solid #1a1a1a;
    transition: background 0.15s;
}
.om-table tbody tr:hover { background: rgba(255,255,255,0.02); }
.om-table tbody td {
    padding: 12px 14px; color: #bbb;
    vertical-align: middle;
}

/* Action buttons in table */
.om-btn-action {
    background: transparent; border: 1px solid transparent;
    border-radius: 6px; padding: 5px; cursor: pointer;
    transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center;
}
.om-btn-action.edit { color: #F5A623; background: rgba(245,166,35,0.1); border-color: rgba(245,166,35,0.2); }
.om-btn-action.edit:hover { background: rgba(245,166,35,0.2); border-color: rgba(245,166,35,0.4); }
.om-btn-action.delete { color: #DC3545; background: rgba(220,53,69,0.1); border-color: rgba(220,53,69,0.2); margin-left: 4px; }
.om-btn-action.delete:hover { background: rgba(220,53,69,0.2); border-color: rgba(220,53,69,0.4); }

</style>

<div class="om">
    <!-- ═══ Header ═══ -->
    <div class="om-header">
        <h2 class="om-header__title">Quản lý <span>Khách hàng</span></h2>
    </div>

    <!-- ═══ Toolbar ═══ -->
    <div class="om-toolbar" style="justify-content: space-between;">
        <div style="display: flex; gap: 10px;">
            <input type="text" id="search-customer" class="om-toolbar__input" style="width:240px" placeholder="Tìm kiếm khách hàng...">
        </div>
        
        <button class="om-toolbar__btn-add" id="btn-add-customer" onclick="openCreateCustomerPanel()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <path d="M16 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/>
            </svg>
            Thêm KH
        </button>
    </div>

    <!-- ═══ CREATE PANEL ═══ -->
    <div class="admin-panel-overlay" id="customer-create-panel">
        <div class="admin-panel">
            <div class="admin-panel__header">
                <h3><i class="fa fa-user-plus"></i> Thêm Khách Hàng</h3>
                <button class="admin-panel__close" onclick="closeAdminPanel('customer-create-panel')">
                    <i class="fa fa-times"></i>
                </button>
            </div>
            <div class="admin-panel__body">
                <div class="admin-panel__field">
                    <label>Tên khách hàng <span style="color:#C8102E">*</span></label>
                    <input type="text" id="create-customer-name" placeholder="Nhập tên khách hàng">
                </div>
                <div class="admin-panel__field">
                    <label>Email <span style="color:#C8102E">*</span></label>
                    <input type="email" id="create-customer-email" placeholder="example@gmail.com">
                </div>
                <div class="admin-panel__field">
                    <label>Số điện thoại</label>
                    <input type="text" id="create-customer-phone" placeholder="09xxxxxxxxx">
                </div>
            </div>
            <div class="admin-panel__footer">
                <button class="btn-admin btn-admin--outline" onclick="closeAdminPanel('customer-create-panel')">Hủy</button>
                <button class="btn-admin btn-admin--primary" onclick="submitCreateCustomer()">Xác nhận</button>
            </div>
        </div>
    </div>

    <!-- ═══ Table ═══ -->
    <table class="om-table">
        <thead>
            <tr>
                <th style="width:50px">#</th>
                <th style="width:30%">Tên khách hàng</th>
                <th style="width:35%">Email</th>
                <th style="width:20%">Số điện thoại</th>
                <th style="width:100px">Hành động</th>
            </tr>
        </thead>
        <tbody id="customer-table">
            <!-- Dữ liệu khách hàng sẽ được thêm vào đây -->
        </tbody>
    </table>
</div>

<script src="./javascript/customerMana.js"></script>
